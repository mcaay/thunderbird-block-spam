      <section id="learning" class="pane" hidden></section>
      <section id="incoming" class="pane" hidden></section>
      <section id="ai" class="pane" hidden></section>
      <section id="shortcuts" class="pane" hidden></section>
      <section id="advanced" class="pane" hidden></section>
      <section id="backup" class="pane" hidden></section>

    <script src="options.js"></script>
